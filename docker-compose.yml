version: "3.9"

services:
  mongodb:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - backend-network

  app-server:
    build: .
    container_name: app-server
    env_file:
      - ./.env.production
    depends_on:
      - mongodb
      - redis
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - backend-network
    command: ["npm", "run", "dev"]

# Uncomment this if you need a worker service
#  worker:
#    build: .
#    container_name: worker
#    env_file:
#      - ./.env.production
#    depends_on:
#      - mongodb
#      - redis
#    volumes:
#      - .:/app
#      - /app/node_modules
#    networks:
#      - backend-network
#    command: ["npx", "nodemon", "worker.js"]

volumes:
  mongo-data:
  redis-data:

networks:
  backend-network:
    driver: bridge
